<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styleHomepage.css">
    <link rel="icon" type="image/x-icon" href="../../assets/images/LogoPucMeet.png">
    <title>PucMeet</title>
</head>

<body>
    <main class="container">
        <header>
            <div>
                <h1><img id="logo" src="../../assets/images/LogoPucMeet.png" alt="Logo PucMeet">PucMeet</h1>
                <p>Fórum universitário</p>
                <span id="userGreeting" class="user-greeting"></span>
            </div>
            <a onclick="toLogin()" id="linkAvatar">
                <img src="../../assets/images/Avatar.png" alt="Avatar perfil" id="fotoPerfil">
            </a>
            <button id="btnLogin" type="button">Login</button>
            
        </header>
        <section id="barraPesquisa">
            <form onsubmit="pesquisarPost(event)">
                <label for="pesquisa">🔍</label>
                <input type="text" id="pesquisa" name="fPesquisa" placeholder="Títulos, autores, categorias...">
            </form>
        </section>

        <section id="carrosselPosts">
            <h2>Posts da Semana</h2>
            <div id="carrosselDiv">

                <div id="setaEsquerda" onclick="btnCarrossel(-1)">◄</div>

                <div id="postSemana"></div>

                <div id="setaDireita" onclick="btnCarrossel(1)">►</div>

            </div>
        </section>

        <section id="postSuggestions">
            <h2>💡 Sugestões para começar</h2>
            <div>
                <button onclick="window.location.href='../criar-post/criarPost.html?id=1'">Alguém pra grupo?</button>
                <button onclick="window.location.href='../criar-post/criarPost.html?id=2'">Preciso de ajuda...</button>
                <button onclick="window.location.href='../criar-post/criarPost.html?id=3'">Quero fazer amigos</button>
                <button onclick="window.location.href='../criar-post/criarPost.html?id=4'">Vamos estudar?</button>
            </div>
        </section>

        <button onclick="window.location.href='../criar-post/criarPost.html'" id="btnCriarPost">+ Criar Post</button>

        <section id="miniPostsSection">
            <h2 id="postSectionTitle">Post Recentes</h2>
            <div id="filtrosPosts">
                <button id="filtroData" onclick="toggleOrdenarPostsPorData()">⏳</button>
                <button id="filtroAlfabeticoNomeAutor" onclick="toggleOrdenarPostsPorNomeAutorAlfabeticamente()">👤
                    ABC</button>
                <button id="filtroQtdComentarios" onclick="toggleOrdenarPostsPorComentarios()">💬</button>
                <button id="filtroCurtidas" onclick="toggleOrdenarPostsPorCurtidas()">👍</button>
            </div>

            <div id="miniPostsList"></div>
        </section>

    </main>

    <script src="js/scriptHomepage.js"></script>

</body>

</html>
