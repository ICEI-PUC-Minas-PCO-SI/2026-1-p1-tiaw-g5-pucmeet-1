<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../assets/images/LogoPucMeet.png">
    <link rel="stylesheet" href="../login/css/cadastro.css">
    <title>Cadastro</title>
</head>

<body>
    <div class="container">
        <h2>Cadastro de Usuário</h2>
        <form id="userForm">
            <input type="hidden" id="userId">
            <div class="form-group">
                <label for="username">Nome:</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" required>
            </div>
            <button type="submit" id="btnSave">Salvar</button>
            <button onclick="window.location.href='login.html'" id="btnSwitchLogin">Login</button>
        </form>

        <h2>Usuários Cadastrados</h2>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
            </tbody>
        </table>
    </div>
    <script src="js/cadastro.js"></script>
    <script src="../homepage/js/scriptHomepage.js"></script>
</body>

</html>
