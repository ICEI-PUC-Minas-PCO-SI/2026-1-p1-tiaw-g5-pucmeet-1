<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../login/css/style.css">
    <link rel="icon" type="image/x-icon" href="../../assets/images/LogoPucMeet.png">
    <title>Login</title>
</head>

<body>
    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="loginName">Nome</label>
                <input type="text" id="loginName" placeholder="Digite seu nome" required>
            </div>
            <div class="form-group">
                <label for="loginEmail">E-mail</label>
                <input type="email" id="loginEmail" placeholder="Digite seu e-mail" required>
            </div>
            <button type="submit">Entrar</button>
            <p class="login-message" id="loginMessage"></p>
            <div class="login-footer">
                <span>Não tem cadastro?</span>
                <a href="cadastro.html">Criar conta</a>
            </div>
        </form>
    </div>

    <script src="js/cadastro.js"></script>
</body>

</html>
